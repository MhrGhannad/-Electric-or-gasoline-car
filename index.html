    <style>

@font-face {
            font-family: Vazir;
            src: 
                url('./Vazir.woff') format('woff'),
                url('./Vazir.woff2') format('woff2');
        }
*{
    box-sizing: border-box;
    font-family: Vazir;
}

body{
    background-color: rgb(209, 208, 208);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}


.box {
    width: 300px;
    height: 200px;
    background-color: #452fc2;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgb(255, 208, 0);
    font-size: 20px;
    margin: 10px;
    cursor: pointer;
    transform: scale(0.98);
}
.container2 {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    min-height: 100vh;
}
.header {
    width: 100%;
    height: 120px;
    background-color: #505050;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;
    box-sizing: border-box;
}

.header h1 {
    color: orange;
    font-size: 30px;
    text-align: center;
    flex: 1;
}

.side-video {
    width: 120px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
}
h3{
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: static;
    margin-bottom: 0px;
}
h2 a{
    color: rgb(255, 208, 0);
    text-decoration: none;
}
.panel{
    background-repeat: no-repeat;
    height: 60vh;
    border-radius: 50px;
    margin: 10px;
    color: white;
    cursor: pointer;
    flex: 0.5;
    position: relative;
    transition: flex 1s ease-in ;
    

}



.panel.active{
    flex: 5;
}

.contioner{
    display: flex;
    width: 90vw;
    transform: translateY(-250px);
}
.click_photo{
   display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    top: -250px; 
}
.natije{
    width: 300px;
    height: 200px;
    background-color: #452fc2;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgb(255, 208, 0);
    font-size: 20px;
    margin: 10px;
    cursor: pointer;
    transform: scale(0.98);
}

/* تنظیمات ریسپانسیو */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow-x: hidden;
}

/* تبلت */
@media (max-width: 992px) {

    .container2 {
        flex-wrap: wrap;
        min-height: auto;
        padding: 30px 10px;
        gap: 10px;
    }

    .box,
    .natije {
        width: 45%;
        height: 160px;
    }

    .contioner {
        width: 95%;
        margin: auto;
        transform: translateY(-100px);
    }

    .panel {
        height: 45vh;
    }

    .header h1 {
        font-size: 23px;
    }
}

/* موبایل */
@media (max-width: 600px) {

    .header {
        height: auto;
        min-height: 90px;
        padding: 10px;
    }

    .header h1 {
        font-size: 16px;
        line-height: 1.8;
    }

    .side-video {
        width: 55px;
        height: 55px;
    }

    .container2 {
        flex-direction: column;
        padding: 20px 10px;
        gap: 12px;
    }

    .box,
    .natije {
        width: 90%;
        height: 110px;
        margin: 0;
        font-size: 16px;
    }

    .contioner {
        width: 95%;
        margin: 20px auto;
        transform: none;
        flex-direction: column;
    }

    .panel {
        flex: none;
        width: 100%;
        height: 100px;
        margin: 5px 0;
        border-radius: 15px;
        background-position: center;
        background-size: cover;
    }

    .panel.active {
        flex: none;
        height: 180px;
    }

    h3 {
        position: static;
        text-align: center;
        font-size: 14px;
        padding: 10px;
    }

    .click_photo {
        position: static;
        margin: 15px 0;
        text-align: center;
    }
}



    </style>
